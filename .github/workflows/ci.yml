name: Julia tests and Documenter
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test-and-docs:
    runs-on: ubuntu-24.04
    env:
      JULIA_NUM_PRECOMPILE_TASKS: '2'
      GKSwstype: '100'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3.5.0
      - name: Instantiate locked environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Test
        run: julia --project=. -e 'using Pkg; Pkg.test()'
      - name: Smoke-test command-line workflows
        run: julia --project=. test/smoke_scripts.jl
      - name: Check generated Markdown
        run: julia --project=. scripts/generate_docs.jl --check
      - name: Build and deploy documentation with Documenter
        env:
          DOCUMENTER_DEPLOY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          DOCUMENTER_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.DOCUMENTER_KEY || '' }}
        shell: bash
        run: |
          set -o pipefail
          julia --project=. docs/make.jl 2>&1 | tee documenter.log
      - name: Report documentation result
        if: always()
        shell: bash
        run: |
          echo '## Documenter build' >> "$GITHUB_STEP_SUMMARY"
          if [ -f docs/build/index.html ]; then
            echo 'HTML generated. See the documentation artifact and build log.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Documentation build did not complete. See job logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: documentation-and-report
          path: |
            docs/build/
            documenter.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lineshape-and-smoke-results
          path: artifacts/
